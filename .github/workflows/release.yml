name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      zip: ${{ steps.archive.outputs.zip }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expected = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected."
          }
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Stage portable app
        run: npm run package:release
      - name: Create ZIP and checksum
        id: archive
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$packageVersion-dev" }
          $zip = "StudyQuest-$version-win-x64.zip"
          Compress-Archive -LiteralPath "release\StudyQuest" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: StudyQuest-windows-x64
          path: |
            ${{ steps.archive.outputs.zip }}
            ${{ steps.archive.outputs.zip }}.sha256

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: StudyQuest-windows-x64
          path: release-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/${{ needs.package.outputs.zip }}
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ needs.package.outputs.zip }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "release-assets/$env:RELEASE_ZIP" `
            "release-assets/$env:RELEASE_ZIP.sha256" `
            --verify-tag `
            --generate-notes `
            --title "StudyQuest $env:GITHUB_REF_NAME"
